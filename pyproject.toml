[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-stage1"
version = "0.1.0"
description = "Stage 1 data preparation and churn modeling for the IBM Telco dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.13,<1",
  "tabulate>=0.9,<1",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
churn-stage1 = "churn_prediction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
